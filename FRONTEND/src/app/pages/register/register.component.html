<div class="register-container">
    <h2>🌸 Miya Cosmetics</h2>
    <p class="subtitle">Create your account</p>

    <div class="form-group">
        <label>Full Name</label>
        <input #nomInput type="text" id="nom" placeholder="Your Name" required [(ngModel)]="nom">
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="your@email.com" required [(ngModel)]="email">
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required [(ngModel)]="password">
    </div>
    <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" id="confirm" placeholder="••••••••" required [(ngModel)]="confirm">
    </div>

    <button (click)="doRegister()">Create My Account</button>
    <div class="error"   id="errorMsg">{{ errorMsg }}</div>
    <div class="success" id="successMsg">{{ successMsg }}</div>

    <hr class="divider">
    <div class="links">
        Have an account already?<a routerLink="/login">Sign in</a>
    </div>
    <div class="links" style="margin-top:8px;">
        <a routerLink="/">Back to store</a>
    </div>
</div>
