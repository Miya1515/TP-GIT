<div class="login-container">
    <h2>🌸 Miya Cosmetics</h2>
    <p class="subtitle">Sign in to your account</p>

    <div class="form-group">
        <label>Email</label>
        <input #emailInput type="email" id="email" placeholder="votre@email.com" required [(ngModel)]="email">
    </div>
    <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required [(ngModel)]="password">
    </div>

    <button (click)="doLogin()">Sign in</button>
    <div class="error" id="errorMsg">{{ errorMsg }}</div>

    <hr class="divider">
    <div class="links">
        Don’t have an account yet?<a routerLink="/register">Create Account</a>
    </div>
    <div class="links" style="margin-top:8px;">
        <a routerLink="/">Back to store</a>
    </div>
</div>
