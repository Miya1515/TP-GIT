<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Miya Cosmetics</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { background: #fdf6f6; }
        .login-container {
            max-width: 400px;
            margin: 80px auto;
            padding: 35px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-container h2 { margin-bottom: 8px; color: #c88a8f; }
        .subtitle { color: #aaa; font-size: 14px; margin-bottom: 24px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { font-size: 13px; color: #666; margin-left: 10px; }
        input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid #ddd;
            box-sizing: border-box;
            margin-top: 4px;
            font-size: 14px;
            outline: none;
        }
        input:focus { border-color: #e8b4b8; }
        button {
            background: #e8b4b8;
            color: white;
            padding: 13px;
            border-radius: 40px;
            width: 100%;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 15px;
            margin-top: 8px;
        }
        button:hover { background: #d9999e; }
        .error { color: red; margin-top: 12px; font-size: 13px; }
        .links { margin-top: 20px; font-size: 13px; color: #888; }
        .links a { color: #c88a8f; font-weight: bold; text-decoration: none; }
        .divider { border: none; border-top: 1px solid #f0e0e0; margin: 20px 0; }
    </style>
</head>
<body>
<div class="login-container">
    <h2>🌸 Miya Cosmetics</h2>
    <p class="subtitle">Connectez-vous à votre compte</p>

    <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="votre@email.com" required autofocus>
    </div>
    <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required>
    </div>

    <button onclick="doLogin()">Se connecter</button>
    <div class="error" id="errorMsg"></div>

    <hr class="divider">
    <div class="links">
        Pas encore de compte ? <a href="/register.html">Créer un compte</a>
    </div>
    <div class="links" style="margin-top:8px;">
        <a href="/index.html">← Retour à la boutique</a>
    </div>
</div>

<script>
    async function doLogin() {
        const email    = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.textContent = '';

        if (!email || !password) {
            errorMsg.textContent = 'Veuillez remplir tous les champs.';
            return;
        }
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('token', data.token);
                localStorage.setItem('role',  data.role);
                localStorage.setItem('nom',   data.nom);
                localStorage.setItem('email', data.email);
                if (data.role === 'ADMIN') {
                    window.location.href = '/admin.html';
                } else {
                    window.location.href = '/index.html';
                }
            } else {
                errorMsg.textContent = 'Email ou mot de passe incorrect.';
            }
        } catch (e) {
            errorMsg.textContent = 'Erreur de connexion au serveur.';
        }
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
